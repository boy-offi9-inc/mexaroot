<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <!-- Mexaroot wordmark: terminal prompt + root -->
  <defs>
    <linearGradient id="mex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E585"/>
      <stop offset="1" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>
  <!-- terminal window -->
  <rect x="24" y="36" width="120" height="128" rx="14" fill="#0D1117" stroke="url(#mex)" stroke-width="3"/>
  <!-- title bar dots -->
  <circle cx="44" cy="56" r="5" fill="#FF5F56"/>
  <circle cx="62" cy="56" r="5" fill="#FFBD2E"/>
  <circle cx="80" cy="56" r="5" fill="#27C93F"/>
  <!-- prompt: > _ with root # -->
  <text x="46" y="112" font-family="Menlo, Consolas, monospace" font-size="40" font-weight="bold" fill="url(#mex)">&gt;#</text>
  <rect x="102" y="118" width="20" height="6" fill="#00E585">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.45;0.9;0.9" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <!-- wordmark -->
  <text x="172" y="118" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" fill="#E6EDF3" letter-spacing="-2">mexa<tspan fill="url(#mex)">root</tspan></text>
  <text x="176" y="152" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="19" fill="#8B949E">one daemon · every runtime · your phone</text>
</svg>
