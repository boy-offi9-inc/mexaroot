name: ci

on:
  push:
    branches: [main]
  pull_request:

# Default: no permissions at all; each job grants only what it needs.
permissions: {}

jobs:
  test:
    strategy:
      # the protocol and runtimes are cross-platform; a fix must not break a
      # client or daemon on the machines it ships for (roadmap: tests on
      # macOS and Windows, not Ubuntu only)
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # pinned to commit SHAs (v4.2.2 / v5.5.0) so a compromised upstream
      # action can't run in this repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        # gofmt output is identical on every platform; Ubuntu is enough
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Fuzz seed corpus
        # runs the committed fuzz corpus as plain unit tests; longer live
        # fuzzing is a local task (see internal/wire/fuzz_test.go)
        run: go test ./internal/wire -run FuzzDecode

  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # the action runs its own setup-go regardless; "stable" (>=1.26)
          # satisfies go.mod, while "go.mod" fails resolution on this repo
          go-version-input: stable
          go-package: ./...

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
